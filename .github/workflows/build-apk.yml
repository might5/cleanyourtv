name: Build CleanYourTV APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download CleanYourTV v3.0.0
        run: |
          set -eu

          curl -fL --retry 3 \
            https://github.com/Gathin23/cleanyourtv/archive/refs/tags/v3.0.0.zip \
            -o source.zip

          unzip -t source.zip
          mkdir -p source
          unzip -q source.zip -d source

          PROJECT_DIR="$(find source -mindepth 1 -maxdepth 1 \
            -type d -name 'cleanyourtv-*' | head -n 1)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Cannot locate the source directory"
            exit 1
          fi

          if [ ! -d "$PROJECT_DIR/launcher" ]; then
            echo "ERROR: Launcher directory not found"
            exit 1
          fi

          echo "PROJECT_DIR=$GITHUB_WORKSPACE/$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Source directory: $PROJECT_DIR"
          ls -la "$PROJECT_DIR/launcher"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK
        run: |
          set -eu

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          if [ ! -d "$SDK" ]; then
            echo "ERROR: Android SDK not found at $SDK"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SDKMANAGER="$(find "$SDK/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Install Android SDK packages
        run: |
          set -eu

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install "platforms;android-34"
          "$SDKMANAGER" --install "build-tools;34.0.0"

      - name: Check Gradle project
        run: |
          set -eu

          cd "$PROJECT_DIR/launcher"

          if [ ! -f gradlew ]; then
            echo "ERROR: Gradle Wrapper not found"
            exit 1
          fi

          if [ ! -f app/build.gradle ] && \
             [ ! -f app/build.gradle.kts ]; then
            echo "ERROR: Launcher app build file not found"
            exit 1
          fi

          chmod +x gradlew
          ./gradlew --version

      - name: Build release APK
        run: |
          set -eu

          cd "$PROJECT_DIR/launcher"

          ./gradlew --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cleanyourtv-v3.0.0-apk
          path: ${{ env.PROJECT_DIR }}/launcher/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
