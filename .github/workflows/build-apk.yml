
name: Build CleanYourTV APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download source archive from repository
        uses: actions/checkout@v4

      - name: Extract source
        run: |
          unzip cleanyourtv-2.3.0.zip -d source
          echo "PROJECT_DIR=$PWD/source/cleanyourtv-2.3.0/launcher" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build APK
        working-directory: source/cleanyourtv-2.3.0/launcher
        run: gradle assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cleanyourtv-v2.3.0-apk
          path: source/cleanyourtv-2.3.0/launcher/app/build/outputs/apk/release/*.apk
